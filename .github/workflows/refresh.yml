name: Refresh shop data

on:
  workflow_dispatch:
  schedule:
    # Daily 04:10 JST (previous day 19:10 UTC)
    - cron: '10 19 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: jankara-json-refresh
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test parsers
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Update shops
        id: chains
        continue-on-error: true
        run: python scripts/update.py chains

      - name: Update MegaBig shops and prices
        id: megabig
        continue-on-error: true
        run: python scripts/update_megabig.py

      - name: Update Jankara prices
        id: jankara
        continue-on-error: true
        run: python scripts/update_prices.py

      - name: Update Big Echo prices
        id: bigecho
        continue-on-error: true
        run: python scripts/update_chain_prices.py

      - name: Update Maneki prices
        id: maneki
        continue-on-error: true
        run: python scripts/update_maneki_prices.py

      - name: Update JoyJoy minimum prices
        id: joyjoy
        continue-on-error: true
        run: python scripts/update_joyjoy_prices.py

      # 元データを先に積み、最新の main の上で金額への変換、確認、圧縮をしてプッシュする。
      # ocr.yml と同時に動いて main が先に進んでも、dist を作り直して再試行するので結果を失わない
      - name: Publish data
        id: publish
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select_changes.py
          bash scripts/push_data.sh "data: refresh" chains.json source

      - name: Fail run when a step failed
        if: steps.chains.outcome == 'failure' || steps.megabig.outcome == 'failure' || steps.jankara.outcome == 'failure' || steps.bigecho.outcome == 'failure' || steps.maneki.outcome == 'failure' || steps.joyjoy.outcome == 'failure' || steps.publish.outcome == 'failure'
        run: |
          echo "::error::Some data sources failed; see logs. Existing data was preserved where possible."
          exit 1
